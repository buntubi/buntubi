# The platform's own apps, created by `flask platform setup` (copy to platform.toml and adapt).
# Run `flask admin create` first: setup needs a superadmin. Running setup again only adds what
# is missing; apps changed in the console or the portal keep their changes.
#
# A confidential app's secret is written into the env file `secret` names (relative to this
# file), at creation or with --rotate-secrets, and never printed.

[[apps]]
client_id = "owner-console"
name = "Owner console"
redirect_uris = ["http://localhost:3420/auth/callback"]
post_logout_redirect_uris = ["http://localhost:3420/"]
scope = "openid profile email admin"
homepage_url = "http://localhost:3420/"
backchannel_logout_uri = "http://localhost:3420/auth/backchannel-logout"
secret = { file = "console.env", key = "CONSOLE_CLIENT_SECRET" }

[[apps]]
client_id = "developer-portal"
name = "Developer portal"
redirect_uris = ["http://localhost:3410/auth/callback"]
post_logout_redirect_uris = ["http://localhost:3410/"]
scope = "openid profile email developer"
homepage_url = "http://localhost:3410/"
backchannel_logout_uri = "http://localhost:3410/auth/backchannel-logout"
secret = { file = "portal.env", key = "PORTAL_CLIENT_SECRET" }

# A product the deployment runs, signing its users in through the platform:
# [[apps]]
# client_id = "my-product"
# name = "My product"
# redirect_uris = ["http://localhost:3000/auth/callback"]
# post_logout_redirect_uris = ["http://localhost:3000/"]
# scope = "openid profile email offline_access"
# homepage_url = "http://localhost:3000/"
# secret = { file = "../../my-product/.env.local", key = "AUTH_CLIENT_SECRET" }

