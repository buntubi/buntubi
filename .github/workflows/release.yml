# Releases come from changesets, never from a hand-made tag. On every push to main:
#   - pending changesets: open or update the "Version packages" pull request, which bumps
#     @buntubi/sdk, writes its CHANGELOG and gives idp/pyproject.toml the same version;
#   - that pull request just merged: publish @buntubi/sdk to npm, then, in this same run (a tag
#     pushed by a workflow starts no other workflow), push the three images to ghcr.io, publish
#     the provider to PyPI as `buntubi` (trusted publishing, environment `pypi`, this file), and
#     create the vX.Y.Z tag with its GitHub release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changesets:
    runs-on: ubuntu-latest
    # The release environment holds RELEASE_TOKEN and is open to main only; npm trusts this job
    # (trusted publishing, environment `release`, this file) instead of a stored token.
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # RELEASE_TOKEN, a personal token: what it pushes and the pull request it opens run CI
      # like any other. With the built-in token GitHub holds those runs for approval.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm hands the upload to npm, which needs 11.5.1 or later for trusted publishing.
      - run: npm install -g npm@^11.5.1
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          # One release per version, vX.Y.Z, made below for the whole product.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Release when no changeset is pending and this version has no tag yet, whatever the action
      # reported: a run that published the SDK but stopped before the rest finishes on the next push.
      - id: version
        env:
          PENDING: ${{ steps.changesets.outputs.hasChangesets }}
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" = "false" ] && [ "$version" != "0.0.0" ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: changesets
    if: needs.changesets.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: provider, file: docker/provider.Dockerfile, args: "" }
          - { name: console, file: docker/app.Dockerfile, args: "APP=console" }
          - { name: portal, file: docker/app.Dockerfile, args: "APP=portal" }
    steps:
      - uses: actions/checkout@v4
      # amd64 and arm64 in one tag, so any host pulls a native image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/idp-${{ matrix.name }}:${{ needs.changesets.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/idp-${{ matrix.name }}:latest
          # Links the image to this repository's Packages.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  python:
    needs: changesets
    if: needs.changesets.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The package carries the built sign-in pages.
      - run: pnpm install --frozen-lockfile && pnpm --filter "idp-frontend..." build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --outdir dist idp
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A retried release does not fail on files already uploaded.
          skip-existing: true

  github-release:
    needs: [changesets, images, python]
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.changesets.outputs.version }}
