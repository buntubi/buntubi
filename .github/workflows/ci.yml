# Every pull request and every push to main: the provider's checks against a real PostgreSQL,
# the web packages' typechecks and builds, dependency audits, and the three images built
# (not pushed). Pull requests from forks get no secrets; none of this needs any.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: idp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: idp
    env:
      IDP_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/idp_test
      IDP_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/idp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idp/requirements.lock
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - name: Migrations up, down and up again, and the models match them
        env:
          IDP_ISSUER: http://localhost:5002
          IDP_SECRET_KEY: ci-only-secret-key-that-is-long-enough-000
          IDP_SIGNING_KEYS_DIR: /tmp/keys
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest -q
      - name: Audit the pinned runtime packages
        run: pip install pip-audit && pip-audit -r requirements.lock --no-deps --progress-spinner off

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: provider, file: docker/provider.Dockerfile, args: "" }
          - { name: console, file: docker/app.Dockerfile, args: "APP=console" }
          - { name: portal, file: docker/app.Dockerfile, args: "APP=portal" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
