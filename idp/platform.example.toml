# The platform's own apps, created by `flask platform setup` (copy to platform.toml and adapt).
# Run `flask admin create` first: setup needs a superadmin. Running setup again only adds what
# is missing; apps changed in the console or the portal keep their changes.
#
# A confidential app's secret is written into the env file `secret` names (relative to this
# file), at creation or with --rotate-secrets, and never printed.

[[apps]]
client_id = "owner-console"
name = "Owner console"
redirect_uris = ["http://localhost:3420/auth/callback"]
post_logout_redirect_uris = ["http://localhost:3420/"]
scope = "openid profile email admin"
homepage_url = "http://localhost:3420/"
backchannel_logout_uri = "http://localhost:3420/auth/backchannel-logout"
secret = { file = "../apps/console/.env", key = "CONSOLE_CLIENT_SECRET" }

[[apps]]
client_id = "developer-portal"
name = "Developer portal"
redirect_uris = ["http://localhost:3410/auth/callback"]
post_logout_redirect_uris = ["http://localhost:3410/"]
scope = "openid profile email developer"
homepage_url = "http://localhost:3410/"
backchannel_logout_uri = "http://localhost:3410/auth/backchannel-logout"
secret = { file = "../apps/portal/.env", key = "PORTAL_CLIENT_SECRET" }

# A product the deployment runs, signing its users in through the platform:
# [[apps]]
# client_id = "my-product"
# name = "My product"
# redirect_uris = ["http://localhost:3000/auth/callback"]
# post_logout_redirect_uris = ["http://localhost:3000/"]
# scope = "openid profile email offline_access"
# homepage_url = "http://localhost:3000/"
# secret = { file = "../../my-product/.env.local", key = "AUTH_CLIENT_SECRET" }

# A public client for trying the APIs from Postman, with PKCE:
# [[apps]]
# client_id = "postman"
# name = "Postman"
# type = "public"
# redirect_uris = ["https://oauth.pstmn.io/v1/callback"]
# scope = "openid profile email offline_access developer"
# first_party = false

# The standard profile fields the platform asks for: "hidden" (the default), "optional" (in the
# account area) or "required" (asked at sign-up too). Shown fields are released under `profile`.
# [profile]
# birthdate = "optional"
# gender = "optional"
# middle_name = "optional"
# nickname = "optional"
# website = "optional"
# zoneinfo = "optional"

# Social sign-in: the providers offered, once their client is set in the env (IDP_GOOGLE_*,
# IDP_GITHUB_*). An app can narrow them with `social_providers = ["github"]` in its entry.
# [social]
# providers = ["google", "github"]

# Whether people can make an account; invited addresses always can. An app can close its own
# sign-up with `signup = false` in its entry.
# [signup]
# open = true
# The version of the terms people accept, with IDP_BRAND_TERMS_URL set: asked at sign-up, and at
# the next sign-in of anyone who has not accepted this version.
# terms_version = "2026-10"
