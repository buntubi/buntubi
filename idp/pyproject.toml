[project]
name = "idp"
version = "0.1.0"
description = "OAuth 2.1 and OpenID Connect provider"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1",
  # Pinned to a minor: 1.8 moved the ID token hooks, and a silent change there drops `kid`.
  "authlib>=1.8,<1.9",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "flask-limiter>=3.8",
  "requests>=2.32",
  "segno>=1.6",
  "email-validator>=2.2",
  "webauthn>=3.0,<4",
  # Imported directly (keys, token checks), not only through authlib and webauthn.
  "cryptography>=44",
  "joserfc>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "openapi-spec-validator>=0.7", "jsonschema>=4.23"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idp = ["templates/*.html", "static/**/*", "security/data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# Test accounts have passwords.
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["idp"]
mypy_path = "src"

# Authlib and flask-limiter ship no type information.
[[tool.mypy.overrides]]
module = ["authlib.*", "flask_limiter.*"]
ignore_missing_imports = true

# The modules built on Authlib's classes and decorators get Any back from them.
[[tool.mypy.overrides]]
module = ["idp.models.*", "idp.oauth.*", "idp.web.*"]
warn_return_any = false
disallow_untyped_decorators = false
