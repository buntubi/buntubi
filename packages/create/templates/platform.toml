# {{name}}'s apps, created by `pnpm run setup`. Running it again only adds what is missing. A
# confidential app's secret is written into the env file `secret` names, relative to this file,
# and never printed. Add the apps that sign in through this provider below.

[[apps]]
client_id = "owner-console"
name = "Owner console"
redirect_uris = ["{{consoleUrl}}/auth/callback"]
post_logout_redirect_uris = ["{{consoleUrl}}/"]
scope = "openid profile email admin"
homepage_url = "{{consoleUrl}}/"
backchannel_logout_uri = "{{consoleUrl}}/auth/backchannel-logout"
secret = { file = "console.env", key = "CONSOLE_CLIENT_SECRET" }

[[apps]]
client_id = "developer-portal"
name = "Developer portal"
redirect_uris = ["{{portalUrl}}/auth/callback"]
post_logout_redirect_uris = ["{{portalUrl}}/"]
scope = "openid profile email developer"
homepage_url = "{{portalUrl}}/"
backchannel_logout_uri = "{{portalUrl}}/auth/backchannel-logout"
secret = { file = "portal.env", key = "PORTAL_CLIENT_SECRET" }

# Social sign-in, once IDP_GOOGLE_* or IDP_GITHUB_* is set in identity.env.
# [social]
# providers = ["google", "github"]

# Whether people can make an account; invited addresses always can.
# [signup]
# open = true
# terms_version = "2026-10"     # asks people to accept the terms at IDP_BRAND_TERMS_URL

# The profile fields asked of people: "hidden" (the default), "optional" or "required".
# [profile]
# birthdate = "optional"
